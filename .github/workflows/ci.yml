name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rspec

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rails-7.0
            ruby-version: '3.1'
            gemfile: gemfiles/rails_7_0.gemfile
            command: bundle exec rspec spec/rails_relay_spec.rb spec/rails_railtie_spec.rb
          - name: rails-7.1
            ruby-version: '3.2'
            gemfile: gemfiles/rails_7_1.gemfile
            command: bundle exec rspec spec/rails_relay_spec.rb spec/rails_railtie_spec.rb
          - name: rack-2.2
            ruby-version: '3.1'
            gemfile: gemfiles/rack_2_2.gemfile
            command: bundle exec rspec spec/rack_integration_spec.rb spec/rack_middleware_spec.rb spec/relay_spec.rb
          - name: rack-3.x
            ruby-version: '3.2'
            gemfile: gemfiles/rack_3.gemfile
            command: bundle exec rspec spec/rack_integration_spec.rb spec/rack_middleware_spec.rb spec/relay_spec.rb
          - name: sidekiq-7.x
            ruby-version: '3.2'
            gemfile: gemfiles/sidekiq_7.gemfile
            command: bundle exec rspec spec/sidekiq_middleware_spec.rb spec/sidekiq_integration_spec.rb
          - name: sidekiq-8.x
            ruby-version: '3.4'
            gemfile: gemfiles/sidekiq_8.gemfile
            command: bundle exec rspec spec/sidekiq_middleware_spec.rb spec/sidekiq_integration_spec.rb
    name: compatibility (${{ matrix.name }})
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      SIMPLECOV_MINIMUM_COVERAGE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: ${{ matrix.command }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rubocop

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: gem build debugbundle.gemspec

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: make smoke
